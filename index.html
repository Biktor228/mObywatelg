<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mObywatel</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #f4f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .page.active {
            display: flex;
        }

        img, video {
            width: 100%;
            height: 100vh;
            object-fit: contain;
            background-color: #f4f5f7;
        }

        .mdowod-click-zone {
            position: absolute;
            top: 20%;
            left: 6%;
            width: 88%;
            height: 28vh;
            cursor: pointer;
            z-index: 20;
        }

        .global-nav-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 12vh;
            z-index: 999999;
            display: flex;
        }
        
        .nav-zone {
            flex: 1;
            height: 100%;
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0);
        }

        .back-click-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 13vh;
            cursor: pointer;
            z-index: 999;
        }

        .white-loader-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #ffffff;
            z-index: 9999999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .loader-container {
            width: 65%;
            max-width: 220px;
            height: 4px;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 2px;
            overflow: hidden;
        }

        .loader-bar {
            width: 100%;
            height: 100%;
            background-color: #0284c7;
            transform-origin: left;
            transform: scaleX(0);
        }

        .animate-bar-1s {
            animation: loadingAnimation 1s linear forwards;
        }
        .animate-bar-2s {
            animation: loadingAnimation 2s linear forwards;
        }

        @keyframes loadingAnimation {
            0% { transform: scaleX(0); }
            100% { transform: scaleX(1); }
        }

        .live-clock-container {
            position: absolute;
            top: 7.5%;
            width: 100%;
            text-align: center;
            z-index: 25;
            pointer-events: none;
        }

        .live-clock-text {
            font-size: 11.5px;
            color: #64748b;
            font-weight: 500;
            letter-spacing: -0.1px;
        }
    </style>
</head>
<body>

    <div class="global-nav-container" id="globalNav">
        <!-- Dodano sprawdzenie warunku czy klikasz w zakładkę, na której już stoisz -->
        <div class="nav-zone" onclick="if(!pageStart.classList.contains('active')) uruchomProces('start', 1000);"></div>
        <div class="nav-zone" onclick="if(!pageServices.classList.contains('active')) uruchomProces('services', 1000);"></div>
    </div>

    <div class="page active" id="pageStart" style="display: flex;">
        <img src="poczatek.png" alt="Ekran początkowy">
        <div class="mdowod-click-zone" onclick="uruchomProces('document', 2000)"></div>
    </div>

    <div class="page" id="pageDocument">
        <div class="back-click-zone" onclick="uruchomProces('start', 2000)"></div>
        <video loop muted playsinline id="myVideo">
            <source src="film.mp4" type="video/mp4">
        </video>
        <div class="live-clock-container">
            <div class="live-clock-text" id="liveClock">Czas: --:--:-- --.--.----</div>
        </div>
    </div>

    <div class="page" id="pageServices">
        <img src="uslugi.png" alt="Usługi">
    </div>

    <div class="white-loader-screen" id="whiteScreen">
        <div class="loader-container">
            <div class="loader-bar" id="loaderBar"></div>
        </div>
    </div>

    <script>
        let video = document.getElementById('myVideo');
        let pageStart = document.getElementById('pageStart');
        let pageDocument = document.getElementById('pageDocument');
        let pageServices = document.getElementById('pageServices');
        let whiteScreen = document.getElementById('whiteScreen');
        let loaderBar = document.getElementById('loaderBar');
        let globalNav = document.getElementById('globalNav');

        function uruchomProces(cel, czasMs) {
            loaderBar.classList.remove('animate-bar-1s', 'animate-bar-2s');
            void loaderBar.offsetWidth; 
            
            whiteScreen.style.display = 'flex';
            if (czasMs === 1000) {
                loaderBar.classList.add('animate-bar-1s');
            } else {
                loaderBar.classList.add('animate-bar-2s');
            }

            globalNav.style.display = 'none';

            if (video.currentTime > 0) {
                video.pause();
                video.currentTime = 0;
            }

            setTimeout(() => {
                pageStart.classList.remove('active');
                pageDocument.classList.remove('active');
                pageServices.classList.remove('active');
                
                pageStart.style.display = 'none';
                pageDocument.style.display = 'none';
                pageServices.style.display = 'none';

                if (cel === 'document') {
                    pageDocument.style.display = 'flex';
                    pageDocument.classList.add('active');
                    video.play().catch(e => console.log("Video block"));
                } else if (cel === 'start') {
                    pageStart.style.display = 'flex';
                    pageStart.classList.add('active');
                    globalNav.style.display = 'flex';
                } else if (cel === 'services') {
                    pageServices.style.display = 'flex';
                    pageServices.classList.add('active');
                    globalNav.style.display = 'flex';
                }

                whiteScreen.style.display = 'none';
            }, czasMs);
        }

        globalNav.style.display = 'flex';

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            
            const clockString = `Czas: ${hours}:${minutes}:${seconds} ${day}.${month}.${year}`;
            document.getElementById('liveClock').textContent = clockString;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
